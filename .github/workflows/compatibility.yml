name: Compatibility source release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-package:
    name: Verify portable compatibility release assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Read release channel
        id: channel
        run: |
          python - <<'PY'
          import json, os
          source = json.load(open("SOURCE_RELEASE.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("compatibility=" + str(source.get("release_channel") == "compatibility-prerelease").lower(), file=output)
          PY
      - name: Install wheel build tools
        if: steps.channel.outputs.compatibility == 'true'
        run: python -m pip install build==1.4.0 setuptools==80.9.0 wheel==0.46.3
      - name: Package committed source and portable API
        if: steps.channel.outputs.compatibility == 'true'
        run: python scripts/package_compatibility_release.py --output build/compatibility-release
      - uses: actions/upload-artifact@v4
        if: steps.channel.outputs.compatibility == 'true'
        with:
          name: compatibility-source-release
          path: build/compatibility-release/*
          if-no-files-found: error
