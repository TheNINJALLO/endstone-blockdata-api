name: Build and Release v0.4.5

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockdata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.4.5-beta.32
  PROJECT_SLUG: endstone-blockdata-api

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify synchronized versions and compatibility metadata
        run: python scripts/verify_project_metadata.py

  portable:
    name: Portable tests v0.4.5 (${{ matrix.os }})
    needs: [metadata]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Configure portable build
        run: cmake -S . -B build -DENDSTONE_BLOCKDATA_BUILD_TESTS=ON -DENDSTONE_BLOCKDATA_BUILD_PLUGIN=OFF
      - name: Build portable targets
        run: cmake --build build --config Release --parallel
      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run Python tests
        run: python -m unittest discover -s tests/python -v

  exact:
    name: Exact v0.4.5 - BDS ${{ matrix.bds }} (${{ matrix.platform }})
    needs: [metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bds: "1.26.33"
          - os: windows-2022
            platform: windows-x64
            bds: "1.26.33"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Conan dependency manager
        run: >-
          python -m pip install
          "conan==2.31.1"
          "build==1.4.0"
          "setuptools==80.9.0"
          "wheel==0.46.3"
          "endstone==0.11.6"

      - name: Install Linux compiler toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          if ! command -v clang-18 &> /dev/null; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 18
          fi
          sudo apt-get install -y ninja-build clang-tools-18 libc++-18-dev libc++abi-18-dev
          sudo update-alternatives --install /usr/bin/clang-scan-deps clang-scan-deps /usr/bin/clang-scan-deps-18 100 || true
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          clang-18 --version
          clang++-18 --version
          cmake --version
          ninja --version

      - name: Locate Windows toolchains
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio 2022 C++ tools were not found" }
          "VS_PATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvm "clang-cl.exe"))) {
            choco install llvm -y --no-progress
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          cmake --version

      - name: Build and package exact plugin on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/build_exact.py             --bds "${{ matrix.bds }}"             --platform "${{ matrix.platform }}"             --parallel 2

      - name: Build and package exact plugin on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          clang-cl --version
          lld-link --version
          ninja --version
          python scripts\build_exact.py --bds "${{ matrix.bds }}" --platform "${{ matrix.platform }}" --parallel 2

      - name: Verify release assets
        run: >-
          python scripts/verify_release_assets.py
          --slug "${{ env.PROJECT_SLUG }}"
          --version "${{ env.RELEASE_VERSION }}"
          --bds "${{ matrix.bds }}"
          --platform "${{ matrix.platform }}"

      - name: Smoke-test relocated Linux command wheel and bundled bridge
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wheels=(dist/release/*-cp314-cp314-linux_x86_64.whl)
          test "${#wheels[@]}" -eq 1
          python tests/python/verify_test_wheel.py "${wheels[0]}"

      - name: Smoke-test relocated Windows command wheel and bundled bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist/release -Filter "*-cp314-cp314-win_amd64.whl")
          if ($wheels.Count -ne 1) { throw "Expected one Windows command wheel; found $($wheels.Count)" }
          $wheelPath = $wheels[0].FullName
          python tests/python/verify_test_wheel.py "$wheelPath"

      - name: Upload compiled plugin package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-exact-${{ matrix.bds }}-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-diagnostics-${{ matrix.bds }}-${{ matrix.platform }}
          path: |
            build-exact/**/CMakeCache.txt
            build-exact/**/CMakeFiles/CMakeOutput.log
            build-exact/**/CMakeFiles/CMakeError.log
            build-exact/**/*.log
            dist/**/*.json
            dist/diagnostics/**/*.log
            .conan2-ci/**/profiles/*
            build-exact/**/conan/**/*.log
          if-no-files-found: warn
          retention-days: 14

  test-wheel:
    name: Build and verify the BlockData command test wheel
    needs: [metadata, exact]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Endstone runtime dependency
        run: python -m pip install "endstone==0.11.6"
      - name: Download both exact-built command wheels
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.PROJECT_SLUG }}-exact-*
          path: dist/test-wheel
          merge-multiple: true
      - name: Verify both platform wheels, entry point, commands, and permissions
        shell: bash
        run: |
          mapfile -t wheels < <(find dist/test-wheel -maxdepth 1 -type f -name '*.whl' | sort)
          test "${#wheels[@]}" -eq 2
          for wheel in "${wheels[@]}"; do
            python tests/python/verify_test_wheel.py "$wheel" --structure-only
          done
      - name: Run Python command-handler tests
        run: python -m unittest discover -s tests/python -v
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-test-wheel
          path: dist/test-wheel/*.whl
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, exact, test-wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PYTAG'
          import json, os
          version = json.load(open('SOURCE_RELEASE.json', encoding='utf-8'))['version']
          expected = f'v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Release tag must be {expected}, got {actual}')
          PYTAG
      - name: Download exact native packages
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.PROJECT_SLUG }}-exact-*
          path: release-assets
          merge-multiple: true
      - name: Generate combined checksums
        working-directory: release-assets
        shell: bash
        run: |
          find . -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.zip' -o -name '*.whl' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          create_flags=()
          edit_flags=(--prerelease=false --latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            create_flags+=(--prerelease)
            edit_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" "${edit_flags[@]}"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --generate-notes "${create_flags[@]}" \
              --title "Endstone BlockData API $RELEASE_TAG"
          fi
