[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-blockdata-inspector"
version = "0.4.5b32"
description = "In-game container, NBT, and block state inspection test plugin for Endstone"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "endstone==0.11.6",
]

[project.entry-points."endstone"]
"blockdata-inspector" = "endstone_blockdata_inspector:BlockDataInspectorPlugin"

[tool.setuptools]
packages = ["endstone_blockdata_inspector"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
endstone_blockdata_inspector = [
    "_endstone_blockdata_live*.pyd",
    "_endstone_blockdata_live*.so",
]
