name = "BlockDataInspectorPlugin"
version = "0.4.5-beta.27"
api-version = "0.4"
description = "Interactive In-Game Container, NBT, and Block State Test Suite"
main = "endstone_blockdata_inspector:BlockDataInspectorPlugin"

[commands.blockdata]
description = "BlockData & NBT Inspection Command Suite"
usages = ["/blockdata <inspect|set|nbt|container> [args...]"]
permissions = ["blockdata.admin"]

[permissions."blockdata.admin"]
description = "Allows access to BlockData Inspector commands"
default = "op"
